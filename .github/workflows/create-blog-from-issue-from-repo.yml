name: Create Blog from Issue from Repo

on:
  issues:
    types: [labeled]

jobs:
  create-blog:
    runs-on: ubuntu-latest

    # Only run for newblogpost label on matching issue titles
    if: |
      github.event.label.name == 'newblogpost' &&
      startsWith(github.event.issue.title, 'create blog entry for ') &&
      github.event.issue.user.login == 'github-actions[bot]'

    permissions:
      contents: write
      pull-requests: write
      issues: read

    env:
      # LLM for aider via litellm. GitHub Models was retired on 2026-07-30.
      # Override without code change: repo variable AIDER_MODEL
      # (Settings -> Secrets and variables -> Actions -> Variables).
      AIDER_MODEL: ${{ vars.AIDER_MODEL || 'groq/llama-3.3-70b-versatile' }}

    steps:
      - name: Checkout blog repo
        uses: actions/checkout@v4

      - name: Extract repo name and issue number
        id: vars
        env:
          ISSUE_TITLE_INPUT: ${{ github.event.issue.title }}
          ISSUE_NUMBER_INPUT: ${{ github.event.issue.number }}
        run: |
          ISSUE_TITLE="$ISSUE_TITLE_INPUT"
          REPO_NAME="${ISSUE_TITLE#create blog entry for }"
          ISSUE_NUMBER="$ISSUE_NUMBER_INPUT"
          BRANCH_NAME="feature/${ISSUE_NUMBER}-${REPO_NAME}-create-blog"
          BLOG_FILE="src/content/blog/${REPO_NAME}.md"
          TODAY=$(date +'%B %d %Y')
          echo "repo_name=${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "issue_number=${ISSUE_NUMBER}" >> $GITHUB_OUTPUT
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "blog_file=${BLOG_FILE}" >> $GITHUB_OUTPUT
          echo "today=${TODAY}" >> $GITHUB_OUTPUT

      - name: Fetch repo metadata, README and license of target repo
        id: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ steps.vars.outputs.repo_name }}
        run: |
          API="https://api.github.com/repos/roebi/${REPO_NAME}"
          AUTH="Authorization: Bearer $GH_TOKEN"

          # Default branch is only reported (links use HEAD, see blog skeleton)
          DEFAULT_BRANCH=$(curl -sf -H "$AUTH" "$API" | jq -r '.default_branch // "unknown"')
          echo "default_branch=${DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Default branch: ${DEFAULT_BRANCH}"

          # README via API: works for any default branch and any README file name
          if curl -sf -H "$AUTH" -H "Accept: application/vnd.github.raw+json" "$API/readme" -o /tmp/target-README.md; then
            echo "README.md fetched"
            head -5 /tmp/target-README.md
          else
            echo "::warning::No README found for ${REPO_NAME}"
            echo "# No README found" > /tmp/target-README.md
          fi

          # License via API: GitHub detects the license type (SPDX) for us
          if LICENSE_JSON=$(curl -sf -H "$AUTH" "$API/license"); then
            LICENSE_NAME=$(echo "$LICENSE_JSON" | jq -r '.license.name // "LICENSE"')
            LICENSE_PATH=$(echo "$LICENSE_JSON" | jq -r '.path // "LICENSE"')
            [ "$LICENSE_NAME" = "Other" ] && LICENSE_NAME="LICENSE"
          else
            echo "::warning::No LICENSE found for ${REPO_NAME}"
            LICENSE_NAME="LICENSE"
            LICENSE_PATH="LICENSE"
          fi
          echo "license_name=${LICENSE_NAME}" >> "$GITHUB_OUTPUT"
          echo "license_path=${LICENSE_PATH}" >> "$GITHUB_OUTPUT"
          echo "Detected license: ${LICENSE_NAME} (${LICENSE_PATH})"

      - name: Create feature branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ${{ steps.vars.outputs.branch_name }}

      - name: Create blog entry skeleton
        run: |
          REPO_NAME="${{ steps.vars.outputs.repo_name }}"
          TODAY="${{ steps.vars.outputs.today }}"
          LICENSE_NAME="${{ steps.repo.outputs.license_name }}"
          LICENSE_PATH="${{ steps.repo.outputs.license_path }}"
          BLOG_FILE="${{ steps.vars.outputs.blog_file }}"

          cat > "$BLOG_FILE" << BLOGEOF
          ---
          title: "${REPO_NAME}"
          description: ""
          pubDate: "${TODAY}"
          heroImage: "/blog-placeholder-2.jpg"
          githubName: "${REPO_NAME}"
          ---

          ## What is this about?

          <!-- generated by aider + aider-skills + skill create-blog-entry-what-is-this-about -->

          ## Links

          - [README](https://github.com/roebi/${REPO_NAME}/blob/HEAD/README.md)
          - [${LICENSE_NAME}](https://github.com/roebi/${REPO_NAME}/blob/HEAD/${LICENSE_PATH})
          BLOGEOF
          echo "Blog skeleton created at $BLOG_FILE"
          cat "$BLOG_FILE"

      - name: Setup Python for aider
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aider-chat and aider-skills
        run: |
          pip install aider-chat aider-skills --break-system-packages

      - name: Validate skill with aider-skills
        run: |
          aider-skills validate skills/create-blog-entry-what-is-this-about
          aider-skills list skills/

      - name: Check LLM provider is reachable
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # aider exits 0 even if every LLM call fails, so check access first
          # with one tiny request through litellm (same library aider uses).
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Repository secret GROQ_API_KEY is missing (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          python3 .github/scripts/litellm-debug.py "$AIDER_MODEL"

      - name: Run aider to fill description and What is this about section
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          REPO_NAME="${{ steps.vars.outputs.repo_name }}"
          BLOG_FILE="${{ steps.vars.outputs.blog_file }}"

          # aider-skills gives the skill index (<available_skills>). In a one-shot
          # --message run aider cannot open the listed SKILL.md on its own,
          # so the skill body is passed with --read as well.
          SKILL_CONTEXT=$(aider-skills tmpfile skills/)
          SKILL_FILE=skills/create-blog-entry-what-is-this-about/SKILL.md

          MSG="You are filling a blog entry file for the GitHub repository '${REPO_NAME}'.
          The file already has a skeleton with empty description and empty What is this about section.
          Use the create-blog-entry-what-is-this-about skill to:
          1. Fill the description frontmatter field with exactly 1 sentence (max 160 characters) summarising what the repo does.
          2. Fill the ## What is this about? section with 3 to 6 sentences in plain prose (no lists, no code blocks).
             First sentence: what the repo is and what it does.
             Middle sentences: key features, use cases, or motivation.
             Last sentence: who benefits or how to get started.
          Base your writing on the content of the provided README.md file.
          Keep the HTML comment line in the What is this about section and write the sentences below it.
          Do NOT change any other part of the file - only fill description and the What is this about section."

          # Groq free tier limits tokens per minute: keep the prompt small,
          # cut long READMEs, no repo map.
          head -c 6000 /tmp/target-README.md > /tmp/target-README-short.md

          # --edit-format whole: the file is tiny, whole is the most robust format
          set -o pipefail
          aider \
            --model "$AIDER_MODEL" \
            --weak-model "$AIDER_MODEL" \
            --no-stream \
            --edit-format whole \
            --map-tokens 0 \
            --no-gitignore \
            --no-show-model-warnings \
            --no-check-update \
            --read "$SKILL_CONTEXT" \
            --read "$SKILL_FILE" \
            --read /tmp/target-README-short.md \
            "$BLOG_FILE" \
            --message "$MSG" \
            --yes \
            --no-auto-commits 2>&1 | tee /tmp/aider-output.txt

          # aider exits 0 on LLM errors, so look for them in its output
          if grep -qE "Empty response received|litellm\.[A-Za-z]*Error|tokens_limit_reached|RateLimitError|APIError|BadRequestError|AuthenticationError" /tmp/aider-output.txt; then
            echo "::error::aider reported an LLM problem, see output above"
            echo "::group::litellm debug call (exact request aider sends)"
            LITELLM_DEBUG=1 python3 .github/scripts/litellm-debug.py "$AIDER_MODEL" || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Validate generated blog entry
        run: |
          # fail here instead of opening a PR with an empty skeleton
          python3 .github/scripts/validate-blog-entry.py "${{ steps.vars.outputs.blog_file }}"
          cat "${{ steps.vars.outputs.blog_file }}"

      - name: Commit and push feature branch
        run: |
          git add ${{ steps.vars.outputs.blog_file }}
          git commit -m "blog: create blog entry for ${{ steps.vars.outputs.repo_name }}"
          git push origin ${{ steps.vars.outputs.branch_name }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "create blog entry for ${{ steps.vars.outputs.repo_name }}" \
            --body "Closes #${{ steps.vars.outputs.issue_number }}

          Blog entry generated for [${{ steps.vars.outputs.repo_name }}](https://github.com/roebi/${{ steps.vars.outputs.repo_name }}).

          Default branch of the repo: \`${{ steps.repo.outputs.default_branch }}\` (blog links use \`HEAD\`, so they keep working after a rename master → main).

          Please review the generated content before merging." \
            --base master \
            --head ${{ steps.vars.outputs.branch_name }}
